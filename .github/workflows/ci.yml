name: CI

# CI do Aegis (docs/fork/README.md, decisão 27). Em todo PR e em todo push no main: formatação e licenças no Linux;
# build, clippy e testes no Windows, no macOS e no Linux. Repositório público: o Actions não custa minutos.
#
# O cache só é salvo no main, como o autor do Templum fazia: o GitHub deixa um PR usar o cache do main, mas não o
# de outro PR, e caches de PR gastariam a cota de 10 GB do repositório.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A versão do Rust vem do rust-toolchain.toml: o rustup a instala na primeira chamada do cargo.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependências de build do GPUI no Linux (as mesmas do CONTRIBUTING.md).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libwayland-dev
      # `cache-on-failure`: um teste falhando no main não deixa a próxima execução sem cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Vários testes herdados do Templum esperam um processo ou uma tela por alguns segundos e falham quando a
      # máquina está lenta, cada vez um diferente. O nextest repete o que falhou e, se passar, marca como FLAKY no
      # log, sem reprovar.
      - run: cargo nextest run --workspace --locked --no-fail-fast --retries 2
      # O nextest não roda doctests.
      - run: cargo test --workspace --locked --doc
