name: Release

# Releases do Aegis (docs/fork/README.md, decisão 25). Uma tag `vX.Y.Z` compila e empacota nos três sistemas e
# publica um release com os arquivos que o atualizador baixa (`files` em crates/aegis-update/src/install.rs) e um
# .sha256 ao lado de cada um. As notas são a seção da versão no CHANGELOG.md; sem ela, as que o GitHub gera. Uma tag
# `-rc.N` é um prerelease.
#
# Repositório público: o Actions não custa minutos. Disparo manual (Actions ▸ Release ▸ Run workflow) é um ensaio:
# os arquivos ficam só como artefatos da execução, sem release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, formats: dmg }
          - { os: macos-latest, target: x86_64-apple-darwin, formats: dmg }
          # O Ubuntu mais antigo dos runners: glibc mais velha faz o binário rodar em mais distribuições.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: "deb,appimage,pacman" }
          # Sem pacman: o PKGBUILD tem nome fixo, que o de x86_64 já usa.
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, formats: "deb,appimage" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, formats: "nsis,wix" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag tem que ser a versão do Cargo.toml, ou os instaladores levariam outra.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: rustup target add ${{ matrix.target }}
      # Dependências de build do GPUI no Linux (as mesmas do CONTRIBUTING.md).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libwayland-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # O cargo-packager não publica binário pronto, então é compilado.
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build -p aegis --release --locked --target ${{ matrix.target }}
      - run: cargo packager -p aegis --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --out-dir "${{ github.workspace }}/dist"
      # Um .app cuja assinatura não confere aparece como "danificado" para quem baixa, sem como abrir.
      - if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP"/dmg/*.app
          hdiutil detach "$RUNNER_TEMP/dmg"
      # O executável solto, para baixar e rodar: um .tar.gz no Linux, o .exe no Windows.
      - if: runner.os == 'Linux'
        run: |
          mkdir aegis-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/aegis LICENSE aegis-${{ matrix.target }}/
          tar -czf dist/aegis-${{ matrix.target }}.tar.gz aegis-${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/aegis.exe dist/aegis-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/PKGBUILD
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && for file in *; do sha256sum "$file" > "$file.sha256"; done)
      - run: |
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## $version" '$0 == heading { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          flags=()
          [[ $version == *-* ]] && flags+=(--prerelease)
          if grep -q '[^[:space:]]' notes.md; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Aegis $version" "${flags[@]}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
